# Blue Street — yields, central bank rates, data surprises and the currency score (owned by Claude;
# see DESIGN.md → data/rates.json, data/policy.json, data/surprises.json, data/score.json).
# Runs before each edition (Chicago time: about 12:25 AM, 7:35 AM and 2:55 PM in winter) and again
# whenever Hercules pushes the calendar or the bank file, so the score uses his latest results.
name: Rates

on:
  schedule:
    - cron: '25 6 * * *'
    - cron: '35 13 * * 1-5'
    - cron: '55 20 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/calendar.json'
      - 'data/banks.json'
      - 'data/marks.json'
      - 'tools/policy-build.cjs'
      - 'tools/surprise-build.cjs'
      - 'tools/rates-build.cjs'
      - 'tools/score-build.cjs'
      - 'tools/xlsx.cjs'
      - '.github/workflows/rates.yml'

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build data/rates.json
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            node tools/rates-build.cjs
          else
            node tools/rates-build.cjs --dry
          fi
      - name: Build data/policy.json (central bank rates)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            node tools/policy-build.cjs
          else
            node tools/policy-build.cjs --dry
          fi
      - name: Build data/surprises.json (data surprises from the calendar)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            node tools/surprise-build.cjs
          else
            node tools/surprise-build.cjs --dry
          fi
      - name: Build data/score.json (the currency score on the site)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            node tools/score-build.cjs
          else
            node tools/score-build.cjs --dry
          fi
      - name: Commit if changed
        if: github.ref == 'refs/heads/main'
        run: |
          # Timestamps change every run; only commit when a number did.
          git add data/rates.json data/policy.json data/surprises.json data/score.json
          if git diff --cached --quiet -I'"updated"'; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git commit -m "data: rates, surprises and currency score"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 10
          done
          echo "Push failed after 3 tries" && exit 1
